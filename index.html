<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NANDI GURUKULA ACADEMY — I PUC KCET Score Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--bg2:#0e1729;--glow:#13c2c2;--glow2:#4f7cff;--card:#0f1826;--card-border:rgba(255,255,255,.08);--ink:#eef2fb;--ink-soft:#aeb9d0;--muted:#6b778f;--accent:#13c2c2;--accent2:#4f7cff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(79,124,255,.22),transparent 60%),radial-gradient(800px 500px at 90% 0%,rgba(19,194,194,.20),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg) 60%);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:28px 18px 60px}
.wrap{width:100%;max-width:640px}
.brand{text-align:center;margin-bottom:8px}
.title-image{width:72%;max-width:520px;height:auto;display:block;margin:0 auto 14px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.brand h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.9rem;letter-spacing:-.4px;line-height:1.15;background:linear-gradient(180deg,#fff,#c7d2ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.subline{color:var(--ink-soft);font-size:.9rem;margin-top:6px;font-weight:500}
.badge-pill{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:9px 18px;border-radius:999px;border:1px solid rgba(19,194,194,.35);background:rgba(19,194,194,.08);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:.6px;color:#8ff0f0}
.badge-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--card-border);border-radius:24px;padding:24px;margin-top:26px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(19,194,194,.5),transparent 40%,rgba(79,124,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.6}
.search-row{display:flex;gap:10px;position:relative;z-index:1}
.input-wrap{flex:1;position:relative}
.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.55}
.search-row input{width:100%;padding:14px 16px 14px 42px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);font-size:.95rem;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
.search-row input::placeholder{color:#5c6884}
.search-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(19,194,194,.18)}
.btn{padding:14px 20px;border-radius:14px;border:none;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .2s}
.btn:active{transform:translateY(1px)}
.btn-search{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121f}
.btn-search:hover{filter:brightness(1.08)}
.btn-print{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.12)}
.error{display:none;margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(255,90,110,.10);border:1px solid rgba(255,90,110,.35);color:#ff9aa8;font-size:.83rem;position:relative;z-index:1}
.result{display:none;margin-top:22px;position:relative;z-index:1}
.result-header{display:flex;align-items:center;gap:15px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.avatar{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121f;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.2rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 22px rgba(79,124,255,.35)}
.rname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.2rem;color:var(--ink)}
.rmeta{color:var(--muted);font-size:.85rem;margin-top:3px;letter-spacing:.3px}
.subject-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
.subject-box{position:relative;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 16px 15px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));overflow:hidden}
.subject-box::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.85}
.subject-box .label{color:var(--ink-soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.subject-box .value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.7rem;color:#ffc93c;margin-top:6px;line-height:1;text-shadow:0 0 18px rgba(255,201,60,.35)}
.subject-box .value .slash{color:var(--muted);font-size:1rem;font-weight:500}
.subject-box .maxline{color:var(--muted);font-size:.75rem;margin-top:5px}
.subject-box.absent::after{background:linear-gradient(180deg,#f0a33c,#e0724a)}
.subject-box.absent .value{color:#f4b45f}
.total-box{margin-top:14px;padding:15px;border-radius:16px;border:1px solid rgba(19,194,194,.25);background:rgba(19,194,194,.06);display:flex;justify-content:space-between;align-items:center}
.total-box .label{color:var(--ink-soft);font-weight:600}
.total-box .value{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:#ffc93c}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-top:20px;color:var(--ink-soft);font-size:.86rem;font-weight:600;cursor:pointer}
.back-link:hover{color:var(--accent)}
.footer{text-align:center;margin-top:26px;color:#586179;font-size:.8rem}
.footer b{color:#9fb0d0}
@media(max-width:600px){body{padding:16px 10px 40px}.title-image{width:82%;border-radius:10px;margin-bottom:12px}.brand h1{font-size:1.45rem}.search-row{flex-direction:column}.btn{width:100%}.card{padding:18px}}
@media print{body{background:#fff;color:#000;padding:0}.title-image{box-shadow:none;border-radius:0}.brand h1{color:#000;-webkit-text-fill-color:#000}.subline,.footer{color:#000}.badge-pill{border-color:#000;color:#000;background:none}.search-row,.back-link{display:none!important}.card{box-shadow:none;border:1px solid #ccc;background:#fff;backdrop-filter:none}.card::before{display:none}.subject-box{background:#fff}.subject-box .value,.total-box .value{color:#b8860b;text-shadow:none}}
</style>
</head>

function initials(name){
  const parts=name.trim().split(/\s+/);
  let out=parts[0][0];
  if(parts.length>1) out+=parts[1][0];
  return out.toUpperCase();
}

function lookupResult(){
  const val=document.getElementById('rollInput').value.replace(/\D/g,'');
  const err=document.getElementById('errorMsg');
  err.style.display='none';
  if(!val){
    err.textContent='Please enter Father Mobile Number.';
    err.style.display='block';
    return;
  }
  const student=students.find(s=>s.roll.replace(/\D/g,'')===val);
  if(!student){
    document.getElementById('resultPanel').style.display='none';
    document.getElementById('printBtn').style.display='none';
    err.textContent='No record found for this Father Mobile Number. Please check and try again.';
    err.style.display='block';
    return;
  }
  showResult(student);
}

function showResult(student){
  document.getElementById('rAvatar').textContent=initials(student.name);
  document.getElementById('rName').textContent=student.name;
  document.getElementById('rMeta').textContent='Father Mobile No. '+student.roll+' · KCET '+student.stream+' STREAM';
  const grid=document.getElementById('subjectGrid');
  grid.innerHTML='';
  let total=0;
  let maxTotal=0;
  student.subjects.forEach(sub=>{
    const absent=typeof sub.marks==='string' && ['AB','A'].includes(sub.marks.toUpperCase());
    const box=document.createElement('div');
    box.className='subject-box'+(absent?' absent':'');
    const valueText=absent?sub.marks.toUpperCase():sub.marks+'<span class="slash"> / '+sub.max+'</span>';
    box.innerHTML='<div class="label">'+sub.name+'</div><div class="value">'+valueText+'</div><div class="maxline">Max marks: '+sub.max+'</div>';
    grid.appendChild(box);
    if(typeof sub.marks==='number') total+=sub.marks;
    maxTotal+=sub.max;
  });
  document.getElementById('resultPanel').style.display='block';
  document.getElementById('printBtn').style.display='inline-block';
}

function resetForm(){
  document.getElementById('resultPanel').style.display='none';
  document.getElementById('printBtn').style.display='none';
  document.getElementById('rollInput').value='';
  document.getElementById('errorMsg').style.display='none';
}
document.querySelector('.back-link').addEventListener('click',resetForm);
document.getElementById('rollInput').addEventListener('keydown',function(e){if(e.key==='Enter')lookupResult();});
